name: Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'doc/**'
      - 'assets/**'

jobs:
  debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out SyncPipe
        uses: actions/checkout@v4
        with:
          path: PipePipeClient

      - name: Check out PipePipeExtractor
        uses: actions/checkout@v4
        with:
          repository: InfinityLoop1308/PipePipeExtractor
          ref: c68e10e2e97495877832d8df6cbac55478083019
          path: PipePipeExtractor

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            PipePipeClient/**/*.gradle*
            PipePipeClient/gradle/wrapper/gradle-wrapper.properties
            PipePipeExtractor/**/*.gradle*
            PipePipeExtractor/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APKs
        working-directory: PipePipeClient
        run: ./gradlew --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Print checksums
        working-directory: PipePipeClient
        run: sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: syncpipe-debug-apks
          path: PipePipeClient/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
